name: Feature request
description: Suggest an idea for this project
labels: [ "enhancement" ]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: textarea
    id: problem
    attributes:
      label: Addressing a Problem?
      description: Is your feature request related to a problem? Please describe it.
  - type: textarea
    id: potential-solution
    attributes:
      label: Potential Solution
      description: Describe the solution you'd like to see implemented.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here.
  - type: checkboxes
    id: submit-pr
    attributes:
      label: Contribution
      description: Do you intend to submit a fix for this bug?
      options:
        - label: I would be willing/able to open a Pull Request to contribute this feature.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description:
        By submitting this issue, you agree to follow LSAPy's
        [Code of Conduct](https://lsapy.readthedocs.io/en/latest/community/code_of_conduct.html).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: markdown
    attributes:
      value: |
        *This template come from [xclim](https://github.com/Ouranosinc/xclim) project.*
